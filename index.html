<!doctype html>
<html lang="pt-BR" data-theme="classic">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Um espaço autoral de Raffael Baptista para escritos, projetos e contribuições.">
    <link rel="me" href="https://bantu.social/@tecnorganico">
    <link rel="stylesheet" href="style.css">
    <title>Raffael Baptista — Tecnorgânico</title>
  </head>
  <body>
    <div class="site-shell">
      <aside class="side-nav" aria-label="Navegação principal">
        <a class="brand" href="./" data-reset>
          <span class="brand-mark"><img src="assets/media/raffael-baptista.jpeg" alt="Raffael Baptista sorrindo, de óculos, diante de um fundo laranja. Fotografia autoral de Raffael Baptista, editada utilizando GPT-5.1."></span>
          <span>
            <strong data-site-name>Raffael Baptista</strong>
            <small data-site-signature>Vida, técnica e palavra.</small>
          </span>
        </a>
        <nav>
          <a href="#conversa" data-nav="home">Início</a>
          <a href="#trajetoria" data-nav="trajetoria">Minha trajetória</a>
          <a href="#escritos" data-nav="escritos">Ler meus escritos</a>
          <a href="#projetos" data-nav="projetos">Conhecer os projetos</a>
          <a href="#contato" data-nav="contato">Falar comigo</a>
        </nav>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Mudar tema visual">mudar tema</button>
      </aside>

      <main class="chat-main">
        <header class="chat-header">
          <div class="avatar"><img data-site-photo src="assets/media/raffael-baptista.jpeg" alt="Raffael Baptista sorrindo, de óculos, diante de um fundo laranja. Fotografia autoral de Raffael Baptista, editada utilizando GPT-5.1."></div>
          <div>
            <h1 class="identity-name" data-site-name>Raffael Baptista</h1>
            <p class="identity-subtitle" data-site-subtitle>Autonomia digital se faz em coletivo</p>
          </div>
          <button class="mobile-theme-toggle" type="button" data-theme-toggle aria-label="Mudar tema visual">tema</button>
        </header>

        <section id="conversa" class="conversation" aria-label="Conversa principal" aria-live="polite">
          <div class="conversation-inner" data-conversation></div>
        </section>

        <footer class="navigation-bar">
          <p class="navigation-hint">Escolha um caminho para continuar.</p>
          <div class="choice-grid" data-choices></div>
          <button class="reset-button" type="button" data-reset>voltar ao início</button>
        </footer>
      </main>
    </div>
    <noscript>
      <p class="noscript">Este protótipo precisa de JavaScript para apresentar os caminhos da conversa.</p>
    </noscript>
    <script src="script.js"></script>
  </body>
</html>
